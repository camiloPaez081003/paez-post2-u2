<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Plataforma de Cursos | Ingeniería de Sistemas</title>
    <meta
      name="description"
      content="Formulario de registro para la plataforma de cursos de la Facultad de Ingeniería de Sistemas."
    />
  </head>
  <body>
    <header>
      <h1>Registro de Nuevo Estudiante</h1>
      <p>Plataforma de Cursos - Facultad de Ingeniería de Sistemas</p>
    </header>
    <main>
      <form
        action="/api/registro"
        method="POST"
        autocomplete="on"
        id="form-registro"
      >
        <fieldset>
          <legend>Datos Personales</legend>
          <div>
            <label for="nombre">Nombre completo *</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              required
              minlength="5"
              maxlength="100"
              autocomplete="name"
            />
          </div>
          <div>
            <label for="email">Correo institucional *</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
              aria-describedby="email-ayuda"
            />
            <p id="email-ayuda">Debe terminar en .edu.co</p>
          </div>
          <div>
            <label for="telefono">Teléfono</label>
            <input
              type="tel"
              id="telefono"
              name="telefono"
              pattern="(\+57)?[0-9]{10}"
              title="Número colombiano: +57 seguido de 10 dígitos"
            />
          </div>
          <div>
            <label for="nacimiento">Fecha de nacimiento *</label>
            <input
              type="date"
              id="nacimiento"
              name="nacimiento"
              required
              min="1985-01-01"
              max="2006-12-31"
            />
          </div>
        </fieldset>
        <fieldset>
          <legend>Datos de Cuenta</legend>
          <div>
            <label for="codigo">Código de estudiante *</label>
            <input
              type="text"
              id="codigo"
              name="codigo"
              required
              pattern="[0-9]{7}"
              title="Debe contener exactamente 7 dígitos"
            />
          </div>
          <div>
            <label for="password">Contraseña *</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              minlength="8"
              pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
              title="Debe incluir mayúsculas, minúsculas y números"
            />
          </div>
          <div>
            <label for="github">Perfil de GitHub</label>
            <input type="url" id="github" name="github" />
          </div>
        </fieldset>
        <fieldset>
          <legend>Información Académica</legend>
          <div>
            <label for="semestre">Semestre actual *</label>
            <input
              type="number"
              id="semestre"
              name="semestre"
              required
              min="1"
              max="10"
            />
          </div>
          <div>
            <label for="promedio">Promedio acumulado</label>
            <input
              type="number"
              id="promedio"
              name="promedio"
              min="0"
              max="5"
              step="0.1"
            />
          </div>
          <fieldset>
            <legend>Jornada *</legend>
            <label
              ><input type="radio" name="jornada" value="diurna" required />
              Diurna</label
            >
            <label
              ><input type="radio" name="jornada" value="nocturna" />
              Nocturna</label
            >
            <label
              ><input type="radio" name="jornada" value="virtual" />
              Virtual</label
            >
          </fieldset>
          <div>
            <label for="enfasis">Área de énfasis</label>
            <select id="enfasis" name="enfasis">
              <optgroup label="Desarrollo de Software">
                <option value="web">Web</option>
                <option value="movil">Móvil</option>
              </optgroup>
              <optgroup label="Datos e Infraestructura">
                <option value="bd">Bases de Datos</option>
                <option value="cloud">Cloud</option>
              </optgroup>
            </select>
          </div>
        </fieldset>
        <fieldset>
          <legend>Preferencias y Perfil</legend>
          <div>
            <label for="experiencia">Nivel de experiencia</label>
            <input
              type="range"
              id="experiencia"
              name="experiencia"
              min="1"
              max="10"
              value="5"
            />
          </div>
          <div>
            <label for="color-perfil">Color de perfil</label>
            <input
              type="color"
              id="color-perfil"
              name="color-perfil"
              value="#C62828"
            />
          </div>
          <fieldset>
            <legend>Áreas de interés</legend>
            <label
              ><input type="checkbox" name="intereses" value="web" /> Web</label
            >
            <label
              ><input type="checkbox" name="intereses" value="ia" /> IA</label
            >
            <label
              ><input type="checkbox" name="intereses" value="data" />
              Datos</label
            >
          </fieldset>
          <div>
            <label for="foto">Foto de perfil</label>
            <input
              type="file"
              id="foto"
              name="foto"
              accept="image/png, image/jpeg"
            />
          </div>
          <div>
            <label for="bio">Biografía</label>
            <textarea id="bio" name="bio" rows="5" maxlength="500"></textarea>
          </div>
        </fieldset>
        <input type="hidden" name="origen" value="portafolio-html5-u2" />
        <input type="hidden" name="version_formulario" value="1.0" />
        <div>
          <button type="submit">Crear mi Cuenta</button>
          <button type="reset">Limpiar Formulario</button>
        </div>
      </form>
    </main>
    <footer>
      <p><small>&copy; 2026 Facultad de Ingeniería de Sistemas</small></p>
    </footer>
  </body>
</html>
